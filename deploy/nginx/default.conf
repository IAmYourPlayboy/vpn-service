# Nginx — reverse proxy для Andigo VPN-сервиса

# HTTP → HTTPS редирект + certbot challenge
server {
    listen 80;
    server_name andigo.su www.andigo.su;

    # Certbot challenge (нужен для получения/продления SSL)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Редирект на HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — основной блок
server {
    listen 443 ssl;
    http2 on;
    server_name andigo.su www.andigo.su;

    # Docker DNS resolver — чтобы nginx обновлял IP контейнеров после рестарта
    resolver 127.0.0.11 valid=10s;

    ssl_certificate /etc/letsencrypt/live/andigo.su/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/andigo.su/privkey.pem;

    # Безопасность SSL
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Заголовки безопасности
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # API — проксируем на FastAPI (переменная для динамического DNS)
    set $backend_upstream backend:8000;

    location /api/ {
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket — пинги серверов
    location /ws/ {
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    # Фронтенд — статика React
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
